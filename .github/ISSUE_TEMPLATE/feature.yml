name: Feature request
description: Propose a feature mapping or integration improvement.
title: "[feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What analysis workflow or capa feature is missing?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: data
    attributes:
      label: Relevant r2 data
      description: Note the JSON commands and fields that can support this feature.

