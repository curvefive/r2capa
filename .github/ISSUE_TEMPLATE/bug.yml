name: Bug report
description: Report incorrect extraction, matching, output, or a crash.
title: "[bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not attach live malware. Prefer a synthetic reproducer or a sample hash.
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Include r2capa, capa, radare2, Python, and operating-system versions.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

